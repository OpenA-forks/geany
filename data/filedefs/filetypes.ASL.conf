[styling=C]
# Edit these in the colorscheme .conf file instead

[keywords]
# all items must be in one line
# statements, named objects, operators, and built-in functions
primary=Alias AccessAs Acquire Add And BankField Break BreakPoint Buffer Case Concatenate ConcatenateResTemplate CondRefOf Connection Continue CopyObject CreateBitField CreateByteField CreateDWordField CreateField CreateQWordField CreateWordField Debug Default DefinitionBlock Device DerefOf Divide Else ElseIf EisaId Event External Fatal Field FindSetLeftBit FindSetRightBit Fprintf GpioInt GpioIo I2cSerialBus I2cSerialBusV2 If Include Index IndexField Load LAnd LEqual LGreaterEqual LGreater LLessEqual LLess LNot LNotEqual LOr Match Method Mid Mod Multiply Mutex Name NAnd NoOp Nor Not Notify Object ObjectType Offset OperationRegion Or Package PowerResource Printf Processor RefOf Register Release Reset ResourceTemplate Return Scope ShiftLeft ShiftRight Signal SizeOf Sleep Sprintf SpiSerialBus SpiSerialBusV2 Stall Store Subtract Switch ThermalZone Timer ToBuffer ToDecimalString ToHexString ToInteger ToPLD ToString ToUUID UartSerialBus UartSerialBusV2 Unload Wait While XOr
# keywords, arguments, attributes, object types, local variables
secondary=Zero One Ones Serialized NotSerialized AnyAcc ByteAcc WordAcc DWordAcc QWordAcc BufferAcc Lock NoLock Preserve WriteAsOnes WriteAsZeros AttribQuick AttribSendReceive AttribByte AttribWord AttribBlock AttribProcessCall AttribBlockProcessCall AttribBytes AttribRawBytes AttribRawProcessBytes PosDecode SubDecode MinFixed MinNotFixed MaxFixed MaxNotFixed Decode16 Decode10 ISAOnlyRanges NonISAOnlyRanges EntireRange ReadWrite ReadOnly Cacheable WriteCombining Prefetchable NonCacheable SystemMemory SystemIO PCI_Config EmbeddedControl SMBus SystemCMOS PciBarTarget IPMI GeneralPurposeIo GenericSerialBus PCC FixedHardware Edge Level ActiveHigh ActiveLow ActiveBoth Shared Exclusive SharedAndWake ExclusiveAndWake PolarityHigh PolarityLow PullDefault PullUp PullDown PullNone IoRestrictionNone IoRestrictionInputOnly IoRestrictionOutputOnly IoRestrictionNoneAndPreserve BusMaster NotBusMaster Width8Bit Width16Bit Width32Bit Width64Bit ControllerInitiated DeviceInitiated LittleEndian BigEndian DataBitsFive DataBitsSix DataBitsSeven DataBitsEight DataBitsNine ParityNone ParityEven ParityOdd ParityMark ParitySpace StopBitsZero StopBitsOne StopBitsOnePlusHalf StopBitsTwo FlowControlNone FlowControlXonXoff FlowControlHardware IRQ IRQNoFlags DMA IO FixedIO FixedDMA Memory24 Memory32 Memory32Fixed WordIO DWordIO QWordIO ExtendedIO DWordMemory QWordMemory WordSpace DWordSpace QWordSpace StartDependentFn StartDependentFnNoPri EndDependentFn VendorShort VendorLong TypeA TypeB TypeF CompatibilityMode UnknownObj IntObj StrObj BuffObj PkgObj FieldUnitObj DeviceObj EventObj MethodObj MutexObj OpRegionObj PowerResObj ProcessorObj ThermalZoneObj BuffFieldObj DDBHandleObj Integer String Local0 Local1 Local2 Local3 Local4 Local5 Local6 Local7 Arg0 Arg1 Arg2 Arg3 Arg4 Arg5 Arg6
# reserved names (_CRS, _DSM, _HID...)

[lexer_properties=C]

[settings]
# default extension used when saving files
extension=asl
lexer_filetype=C
tag_parser=C

# MIME type
mime_type=text/x-acpi-asl

# these characters define word boundaries when making selections and searching
# using word matching options
#wordchars=_abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

# these comments are used for PHP, the comments used in HTML are in filetypes.xml
# single comments, like # in this file
comment_single=//
# multiline comments
comment_open=/*
comment_close=*/

# set to false if a comment character/string should start at column 0 of a line, true uses any
# indentation of the line, e.g. setting to true causes the following on pressing CTRL+d
# 		#command_example();
# setting to false would generate this
# #		command_example();
# This setting works only for single line comments
comment_use_indent=true

# context action command (please see Geany's main documentation for details)
context_action_cmd=xdg-open "https://uefi.org/htmlspecs/ACPI_Spec_6_4_html/19_ASL_Reference/ACPI_Source_Language_Reference.html"

[indentation]
#width=4
# 0 is spaces, 1 is tabs, 2 is tab & spaces
#type=1

[build-menu]
# Compilation asl/dsl source via iasl; %f will be replaced by the complete filename.
FT_00_LB=_iasl (Compiler)
FT_00_CM=iasl -vi "%f"
FT_00_WD=%d
# Decompilation via iasl (part of the acpica-tools package) -> %e.aml located the same directory.
FT_01_LB=_iasl (Disassembler)
FT_01_CM=iasl -d "%e.aml"
FT_01_WD=%d
